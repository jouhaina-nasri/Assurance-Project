# Configuration de test : H2 en mémoire, service ML simulé (@MockBean)
spring.datasource.url=jdbc:h2:mem:assurance;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

com.sb.jwtSecret=secret-de-test
com.sb.jwtExpirationMs=3600000

ml.service.url=http://localhost:1
workflow.sinistre.delai-escalade=PT1H
camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.database.schema-update=true
camunda.bpm.job-execution.enabled=false
camunda.bpm.history-level=full
