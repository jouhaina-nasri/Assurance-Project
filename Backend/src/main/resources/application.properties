#datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/STAR?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# jpa hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect

# server port
server.port = 8090
server.error.include-message=always

com.sb.jwtSecret= assuranceee
com.sb.jwtExpirationMs= 1296000000
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

# service ML de scoring du risque des sinistres (ml-service/)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.timeout-ms=3000

# workflow Camunda d'approbation des sinistres
workflow.sinistre.delai-escalade=P2D
camunda.bpm.admin-user.id=${CAMUNDA_ADMIN_USER:demo}
camunda.bpm.admin-user.password=${CAMUNDA_ADMIN_PASSWORD:demo}
camunda.bpm.filter.create=Toutes les taches
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=full
