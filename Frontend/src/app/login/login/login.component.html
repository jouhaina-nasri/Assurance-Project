<div class="signup-form">
     <form class="example-form" *ngIf="!isLoggedIn" name="form" (ngSubmit)="f.form.valid && onSubmit()" #f="ngForm" novalidate>
      
         <div class="row">
            <div class="col-8 offset-4">
              <h2>Connectez-vous</h2>
            </div>  
         </div>  

         <div class="form-group row">
          <div class="col-xs-12">
          <mat-form-field class="example-full-width">
            <mat-label for="Username"> Username  </mat-label>
            <input type="text" matInput class="form-1" id="Username" name="Username" required [(ngModel)]="form.username" required #username="ngModel" />
            <span matSuffix><mat-icon>account_circle</mat-icon>&nbsp;</span>
            <div class="alert alert-danger" role="alert" *ngIf="username.errors && f.submitted" >
            Username is required!
          </div>
          </mat-form-field>
          </div>
         </div>

         <div class="form-group row">
          <div class="col-xs-12">
          <mat-form-field class="example-full-width">
            <mat-label for="password"> Mot de passe  </mat-label>
            <input [type]="hide ? 'password' : 'text'" class="form-1" matInput id="Password" name="Password"required  [(ngModel)]="form.password" #password="ngModel">
            <span matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
              <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
            </span>
            <div  class="alert alert-danger" role="alert" *ngIf="password.errors && f.submitted"></div>
        </mat-form-field> 
        </div>
         </div>  
     
         <div class="form-group row">
          <div class="col-xs-12">
          <button class="btn btn-primary btn-lg" type="submit">Connectez-vous</button>
          </div>  
         </div>     
         <div class="form-group">
          <div
            class="alert alert-danger"
            role="alert"
            *ngIf="f.submitted && isLoginFailed"
          >
            Login failed: {{ errorMessage }}
          </div>
        </div>
     </form>
  </div>
