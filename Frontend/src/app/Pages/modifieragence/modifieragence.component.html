
<div class="signup-form">
    <form class="example-form" (ngSubmit)="onSubmit()">
        <div class="row">
           <div class="col-8 offset-4">
             <h2>Modifier les informations liés à l'agence</h2>
           </div>  
        </div>  
        <div class="row">
            <div class="col-md-4 mb-4">
                <mat-form-field>
                    <mat-label>Code</mat-label>
                    <input matInput type="number" class="form-1" name="code" id="code" required [(ngModel)]="agence.code">
                    <span matSuffix><mat-icon> vpn_key</mat-icon>&nbsp;</span>
                </mat-form-field>
            </div>
            <div class="col-md-4 mb-4" >
                <mat-form-field>
                    <mat-label>Local</mat-label>
                    <input matInput type="text" class="form-1" name="local" id="local" required [(ngModel)]="agence.local">
                    <span matSuffix><mat-icon> place</mat-icon>&nbsp;</span>
                </mat-form-field>
            </div>
            <div class="col-md-4 mb-4" >
                <mat-form-field>
                    <mat-label>Nom du chef d'agence</mat-label>
                    <input matInput type="text" class="form-1" name="nom" id="nom" required [(ngModel)]="agence.nom" >
                    <span matSuffix><mat-icon>account_circle</mat-icon>&nbsp;</span>
                </mat-form-field>
            </div>
          
        </div>
        <div class="row">
            <div class="col-md-4 mb-4">
                <mat-form-field>
                    <mat-label>Prenom du chef d'agence</mat-label>
                    <input matInput type="text" class="form-1" name="prenom" id="prenom" required [(ngModel)]="agence.prenom">
                    <span matSuffix><mat-icon>account_circle</mat-icon>&nbsp;</span>
                </mat-form-field>
            </div>
            <div class="col-md-4 mb-4" >
                <mat-form-field >
                    <mat-label>Contact</mat-label>
                    <input matInput type="text" class="form-1" name="tel" id="tel" required  [(ngModel)]="agence.tel">
                    <mat-icon matSuffix>phone</mat-icon>
                </mat-form-field>
            </div>
            <div class="col-md-4 mb-4" >
                <mat-form-field>
                    <mat-label>Adresse e-mail</mat-label>
                    <input matInput type="text" class="form-1" name="email" id="email" required [(ngModel)]="agence.email" >
                    <span matSuffix><mat-icon> mail_outline</mat-icon>&nbsp;</span>
                </mat-form-field>
            </div>
          
        </div>

               
        <div>
            <button mat-button class="btn-danger" TYPE="reset" style="margin-top: 20px;">Annuler</button>
            <button mat-button class="btn-primary" TYPE="submit" style="margin-top: 20px;">Modifier</button>
        </div>
   
    </form>
</div>
