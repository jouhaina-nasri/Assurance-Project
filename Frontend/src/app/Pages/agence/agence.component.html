<div class="signup-form"  style="margin-top:-5em ;">
      <h2>Liste des agences</h2> 
</div>

<mat-form-field appearance="standard" style="margin-top:-5em ;">
    <mat-label>Chercher</mat-label>
    <input matInput (keyup)="applyFilter($event)"  #input>
  </mat-form-field>
  
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="agences" matSort>

  
      <!-- Code Column -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Code </th>
        <td mat-cell *matCellDef="let row"> {{row.code}} </td>
      </ng-container>

      <!-- Local Column -->
      <ng-container matColumnDef="local">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Local </th>
        <td mat-cell *matCellDef="let row"> {{row.local}} </td>
      </ng-container>

      <!-- Chef d'agence Column -->
      <ng-container matColumnDef="chef">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Chef d'agence </th>
        <td mat-cell *matCellDef="let row"> {{row.nom}} {{row.prenom}} </td>
      </ng-container> 
                  
      <!-- contact Column -->
      <ng-container matColumnDef="contact">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Contact </th>
        <td mat-cell *matCellDef="let row"> {{row.tel}} </td>
      </ng-container> 
      
      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Adresse e-mail </th>
        <td mat-cell *matCellDef="let row"> {{row.email}} </td>
      </ng-container>  

      <!-- Actions Column -->
      <ng-container matColumnDef="Actions">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Actions </th>
        <td mat-cell *matCellDef="let row">
            <mat-icon (click)="openDialog(row.id)" title="Close">lock</mat-icon>
            <mat-icon routerLink="/menu/modifieragence/{{row.id}}" title="Modifier" style="color:blue;"> edit </mat-icon>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
      </tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
