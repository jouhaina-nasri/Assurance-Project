
<div class="signup-form">
    <form class="example-form" [formGroup]="Formulaire" (ngSubmit)="onSubmit()">
        <div class="row">
            <div class="col-8 offset-4">
                <h2>Calculer prix : pour les clients VIP</h2>
            </div>  
        </div>  

        <div class="row">
            <div class="col-md-4 mb-4">
                <mat-form-field>
                    <mat-label>Matricule</mat-label>
                    <input matInput type="text" name="matricule" class="form-1" id="matricule" required formControlName="matricule">
                    <span matSuffix><mat-icon> directions_car</mat-icon>&nbsp;</span>
                </mat-form-field>
            </div>
        </div>
               
        <div>
            <button mat-button class="btn-danger" TYPE="reset" style="margin-top: 20px;">Annuler</button>
            <button mat-button class="btn-primary" TYPE="submit" style="margin-top: 20px;">Calculer</button>
            <h4 *ngIf="resultat!=null" style="margin-left:200px ;color: black;">Montant à payer : {{resultat}}dt</h4>
        </div>
   
    </form>
</div>
