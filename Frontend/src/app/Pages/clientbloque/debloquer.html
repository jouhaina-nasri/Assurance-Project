<h2 mat-dialog-title>Debloquer le client</h2>

<mat-dialog-content class="mat-typography">
  <h3>Voulez-vous debloquer ce client?</h3>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Annuler</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Debloquer</button>
</mat-dialog-actions>
