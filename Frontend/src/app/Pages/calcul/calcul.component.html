
<div class="signup-form">
    <form class="example-form" [formGroup]="Formulaire" (ngSubmit)="onSubmit()">
        <div class="row">
            <div class="col-8 offset-4">
                <h2>Calculer prix : voiture privee ou d'affaire</h2>
            </div>  
        </div>  
        <div class="row">
            <div class="col-md-4 mb-4">
                <mat-form-field >
                    <mat-label>Nombre de chevaux</mat-label>
                    <mat-select [(ngModel)]="selectedValue" name="cv" required formControlName="cv">
                        <mat-option *ngFor="let cv of chevaux" [value]="cv.value">
                        {{cv.viewValue}}
                        </mat-option>
                    </mat-select>
                    <span matSuffix><mat-icon> directions_car</mat-icon>&nbsp;</span>
                </mat-form-field>
            </div>
            <div class="col-md-4 mb-4">
                <mat-form-field >
                    <mat-label>Durée</mat-label>
                    <mat-select [(ngModel)]="selectedValue1" name="mf" required formControlName="mf">
                        <mat-option *ngFor="let m of mf" [value]="m.value">
                        {{m.viewValue}}
                        </mat-option>
                    </mat-select>
                    <span matSuffix><mat-icon>date_range</mat-icon>&nbsp;</span>
                </mat-form-field>
            </div>
            <div class="col-md-4 mb-4">
                <mat-form-field  >
                    <mat-label>Prix voiture</mat-label>
                    <input matInput type="number" name="prix" id="prix"  placeholder="0" class="form-1" required formControlName="prix">
                    <span matSuffix>dt&nbsp;</span>
                </mat-form-field>  
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-4" >
                <mat-form-field >
                    <mat-label>Classe</mat-label>
                    <mat-select [(ngModel)]="selectedValue2" name="classe"  required formControlName="classe">
                        <mat-option *ngFor="let c of classe" [value]="c.value">
                        {{c.viewValue}}
                        </mat-option>
                    </mat-select>
                    <span matSuffix><mat-icon>star</mat-icon>&nbsp;</span>
                </mat-form-field>
            </div>
            <div class="col-md-4 mb-4" >
                <mat-form-field>
                    <mat-label>Nombre de place</mat-label>
                    <input matInput type="number" name="nbplace" id="nbplace" class="form-1" required formControlName="nbplace">
                    <span matSuffix><mat-icon>airline_seat_recline_normal</mat-icon>&nbsp;</span>
                </mat-form-field>
            </div>
            <div class="col-md-4 mb-4" style="margin-top: 20px;">
                <mat-checkbox [formControl]="hideRequiredControl1">Assistance</mat-checkbox>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-4" style="margin-top: 20px;">
                <mat-checkbox [formControl]="hideRequiredControl">Bris de glace</mat-checkbox>
            </div>
            <div class="col-md-4 mb-4" style="margin-top: 20px;" *ngIf="this.hideRequiredControl.value==true"  >
                <mat-radio-group 
                name="radioOpt1" 
                [(ngModel)]="selectedRadio"
                (change)="radioChange($event)">
                <mat-radio-button *ngFor="let opt of bg" 
                    [value]="opt">{{opt.viewValue}}dt</mat-radio-button>
            </mat-radio-group>
            </div>
        </div>
               
        <div>
            <button mat-button class="btn-danger" TYPE="reset" style="margin-top: 20px;">Annuler</button>
            <button mat-button class="btn-primary" TYPE="submit" style="margin-top: 20px;">Calculer</button>
            <h4 *ngIf="resultat!=null" style="margin-left:200px ;color: black;">Montant à payer : {{resultat}}dt</h4>
        </div>
   
    </form>
</div>
