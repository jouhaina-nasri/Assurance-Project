
<div class="signup-form">
    <form class="example-form" (ngSubmit)="onSubmit()">
      <div class="row">
          <div class="col-8 offset-4">
             <h2>Modifier les informations liés à l'utilisateur</h2>
          </div>  
      </div>  
      <div class="row">
        <div class="col-md-4 mb-4">
          <mat-form-field>
            <mat-label>Numéro carte d'identité</mat-label>
            <input matInput type="number" name="cin" id="cin" class="form-1" required  [(ngModel)]="agents.cin" >
            <span matSuffix><mat-icon>folder_shared</mat-icon>&nbsp;</span>
          </mat-form-field>
        </div>
        <div class="col-md-4 mb-4" >
          <mat-form-field>
            <mat-label>Nom</mat-label>
            <input matInput type="text" name="nom" id="nom" class="form-1" required [(ngModel)]="agents.nom">
            <span matSuffix><mat-icon>account_circle</mat-icon>&nbsp;</span>
          </mat-form-field>
        </div>
        <div class="col-md-4 mb-4">
          <mat-form-field>
            <mat-label>Prenom</mat-label>
            <input matInput type="text" name="prenom" id="prenom" class="form-1" required [(ngModel)]="agents.prenom">
            <span matSuffix><mat-icon>account_circle</mat-icon>&nbsp;</span>
        </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 mb-4" >
          <mat-form-field>
            <mat-label>Username</mat-label>
            <input matInput type="text" name="username" id="username" class="form-1" required [(ngModel)]="agents.username">
            <span matSuffix><mat-icon>account_circle</mat-icon>&nbsp;</span>
          </mat-form-field>
        </div>
        <div class="col-md-4 mb-4" >
          <mat-form-field >
            <mat-label>Choisir l'agence</mat-label>
            <mat-select [(value)]="agents.agence.local" name="agence" required>
              <mat-option *ngFor="let agence of agences" [value]="agents.agence.local" >
                {{agence.local}}
              </mat-option>
            </mat-select>
            <span matSuffix><mat-icon> place</mat-icon>&nbsp;</span>
          </mat-form-field>
        </div>
      </div> 
             
      <div>
        <button mat-button class="btn-danger" TYPE="reset" style="margin-top: 20px;">Annuler</button>
        <button mat-button class="btn-primary" TYPE="submit" style="margin-top: 20px;">Modifier</button>
      </div>
   
    </form>
</div>
