<div class="signup-form"  style="margin-top:-5em ;">
  <h2>Liste des utilisateurs</h2> 
</div>

<mat-form-field appearance="standard" style="margin-top:-5em ;">
<mat-label>Chercher</mat-label>
<input matInput (keyup)="applyFilter($event)"  #input>
</mat-form-field>

<div class="mat-elevation-z8">
<table mat-table [dataSource]="agents" matSort>


  <!-- Cin Column -->
  <ng-container matColumnDef="cin">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Cin </th>
    <td mat-cell *matCellDef="let row"> {{row.cin}} </td>
  </ng-container>

  <!-- Nom Column -->
  <ng-container matColumnDef="nom">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Nom </th>
    <td mat-cell *matCellDef="let row"> {{row.nom}} </td>
  </ng-container>

  <!-- Prenom Column -->
  <ng-container matColumnDef="prenom">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Prenom </th>
    <td mat-cell *matCellDef="let row"> {{row.prenom}} </td>
  </ng-container>

  <ng-container matColumnDef="Actions">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Actions </th>
    <td mat-cell *matCellDef="let row" > 
        
        <mat-icon (click)="openDialog(row.id)" title="Bloquer">lock</mat-icon>
        <mat-icon routerLink="/menu/modifieragent/{{row.id}}" title="Modifier" style="color:blue;"> edit </mat-icon>

    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <!-- Row shown when there is no matching data. -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
  </tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
</div>
