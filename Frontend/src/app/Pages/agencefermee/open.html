<h2 mat-dialog-title>Rouvrir l'agence</h2>

<mat-dialog-content class="mat-typography">
  <h3>Voulez-vous rouvrir cette agence une autre fois?</h3>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Annuler</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Rouvrir</button>
</mat-dialog-actions>
