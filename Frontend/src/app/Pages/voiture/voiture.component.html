<div class="signup-form"  style="margin-top:-5em ;">
  <h2>Liste des véhicules</h2> 
</div>

<mat-form-field appearance="standard" style="margin-top:-5em ;">
<mat-label>Chercher</mat-label>
<input matInput (keyup)="applyFilter($event)"  #input>
</mat-form-field>

<div class="mat-elevation-z8">
<table mat-table [dataSource]="voiture" matSort>

  <!-- serie Column -->
  <ng-container matColumnDef="matricule">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Matricule </th>
    <td mat-cell *matCellDef="let row"> {{row.matricule}} </td>
  </ng-container>

  <!-- prix Column -->
  <ng-container matColumnDef="prix">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Prix </th>
    <td mat-cell *matCellDef="let row"> {{row.prix}} </td>
  </ng-container>

 <!-- nbplace Column -->
 <ng-container matColumnDef="nbplace">
  <th mat-header-cell *matHeaderCellDef mat-sort-header> nbplace </th>
  <td mat-cell *matCellDef="let row"> {{row.nbplace}} </td>
</ng-container>

<!-- type Column -->
<ng-container matColumnDef="type">
  <th mat-header-cell *matHeaderCellDef mat-sort-header> type </th>
  <td mat-cell *matCellDef="let row"> {{row.type}} </td>
</ng-container>

  <ng-container matColumnDef="Actions">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Actions </th>
    <td mat-cell *matCellDef="let row" > 
      <mat-icon (click)="openDialog(row.id)" title="Supprimer"style="color: rgba(255, 0, 0, 0.664); ">delete</mat-icon>
        <mat-icon routerLink="/menu/modifiervoiture/{{row.id}}" title="Modifier" style="color:blue;"> edit </mat-icon>

    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <!-- Row shown when there is no matching data. -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
  </tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
</div>
