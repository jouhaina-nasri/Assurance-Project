
<div class="signup-form">
    <form class="example-form" (ngSubmit)="onSubmit()">
      <div class="row">
          <div class="col-8 offset-4">
             <h2>Modifier les informations liés à le client</h2>
          </div>  
      </div>  
      <div class="row">
        <div class="col-md-4 mb-4">
          <mat-form-field>
            <mat-label>Numéro carte d'identité</mat-label>
            <input matInput type="number" name="cin" id="cin" required class="form-1" [(ngModel)]="clients.cin">
            <span matSuffix><mat-icon>folder_shared</mat-icon>&nbsp;</span>
          </mat-form-field>
        </div>
        <div class="col-md-4 mb-4" >
          <mat-form-field>
            <mat-label>Nom</mat-label>
            <input matInput type="text" name="nom" id="nom" required class="form-1"  [(ngModel)]="clients.nom">
            <span matSuffix><mat-icon>account_circle</mat-icon>&nbsp;</span>
          </mat-form-field>
        </div>
        <div class="col-md-4 mb-4">
          <mat-form-field>
            <mat-label>Prenom</mat-label>
            <input matInput type="text" name="prenom" id="prenom" class="form-1" required [(ngModel)]="clients.prenom">
            <span matSuffix><mat-icon>account_circle</mat-icon>&nbsp;</span>
        </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 mb-4" >
            <mat-form-field >
                <mat-label>Classe</mat-label>
                <mat-select [(ngModel)]="selectedValue2" name="classe" required [(ngModel)]="clients.classe">
                    <mat-option *ngFor="let c of classe" [value]="c.value">
                    {{c.viewValue}}
                    </mat-option>
                </mat-select>
                <span matSuffix><mat-icon>star</mat-icon>&nbsp;</span>
            </mat-form-field>
        </div>
        
        <div class="col-md-4 mb-4" >
          <mat-form-field >
            <mat-label>Choisir l'agence</mat-label>
            <mat-select [(value)]="clients.agence.local" name="agence" required>
              <mat-option *ngFor="let agence of agences" [value]="clients.agence.local" >
                {{agence.local}}
              </mat-option>
            </mat-select>
            <span matSuffix><mat-icon> place</mat-icon>&nbsp;</span>
          </mat-form-field>
        </div>
      </div> 
             
      <div>
        <button mat-button class="btn-danger" TYPE="reset" style="margin-top: 20px;">Annuler</button>
        <button mat-button class="btn-primary" TYPE="submit" style="margin-top: 20px;">Modifier</button>
      </div>
   
    </form>
</div>
