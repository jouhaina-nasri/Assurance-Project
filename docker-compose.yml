services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: STAR
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

  backend:
    build: ./Backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/STAR?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: root
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started

volumes:
  mysql-data:
